# Nav2 bring-up config (M7 Phase 1) - planner, controller, behavior_server,
# bt_navigator, and both costmaps for goal navigation against the M5
# localization stack (map_server + amcl, launched separately by
# localize.launch.py) and the M5 Phase 2 local map cache
# (~/ros2_ws/maps/active/map.yaml). All nodes here are pure TF *consumers*
# (robot-interface.md TF ownership: amcl owns map->odom, ekf_filter_node
# owns odom->base_footprint, robot_state_publisher owns the rigid tree) -
# nothing in this file publishes a transform.
#
# controller_server's velocity output is remapped to /cmd_vel_nav in
# navigate.launch.py (never /cmd_vel or /cmd_vel_raw directly) - see the
# CONTROLLER_REMAPPINGS constant there, asserted by test/test_nav_config.py.

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
      stateful: true

    # Regulated Pure Pursuit - the simple robust default for a small
    # diff-drive indoor robot (M7 Notable risks: DWB/MPPI/Smac not chosen,
    # revisit only if RPP tracking proves inadequate). Speeds kept
    # conservative and in line with rambla_traversal's existing wander
    # speeds (forward_speed=0.15 m/s, turn_speed=0.5 rad/s -
    # wander_behavior.py) rather than nav2's turtlebot-tuned stock defaults,
    # since this is the same small placeholder body (PHY-004, base_diameter
    # 0.349m) driving the same tight house.sdf rooms.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15
      lookahead_dist: 0.4
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.5
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.05
      use_fixed_curvature_lookahead: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.5
      max_robot_pose_search_dist: 5.0
      # Diff-drive: can rotate in place, no minimum turning radius.
      min_turning_radius: 0.0

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: false
      allow_unknown: false

# Default NavigateToPose BT (nav2_bt_navigator's packaged
# navigate_to_pose_w_replanning_and_recovery.xml) is used unmodified - it
# already wraps the main nav sequence in a RecoveryNode that dispatches the
# spin/backup/wait behavior_plugins above on failure, satisfying the M7
# scope decision to use Nav2's built-in recovery rather than a custom BT.
# No default_nav_to_pose_bt_xml override here; test_nav_config.py resolves
# and parses the actual installed default to prove the recovery subtree is
# really in the tree bt_navigator will run, not just assumed.
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    transform_tolerance: 0.5

# Static map (from the M5 Phase 2 local cache) + inflation - long-horizon
# planning surface. Nav2 must not publish any transform; global_costmap
# only ever subscribes to /map (published by map_server, transient-local).
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: false
      # Real robot footprint (not a default radius - see robot-interface.md
      # "P1-1 bumper footprint geometry is resolved" and params.xacro):
      # base_diameter/2 + bumper_thickness/2 = 0.349/2 + 0.010/2 = 0.1795m,
      # the body's true circular radius plus the bumper's ~5mm proud face
      # (params.xacro bumper_thickness comment). The body is genuinely
      # circular (base_link is a plain cylinder), so a radius footprint is
      # the real shape here, not an approximation of a non-circular one.
      robot_radius: 0.1795
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4

# Rolling local costmap fed by live /scan (architectural requirement per
# navigation/CLAUDE.md's "Stale-map obstacle avoidance via costmap
# layering" note - reroutes around a moved/stale obstacle without a map
# rebuild). No static_layer here; the global plan already carries the map.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.05
      rolling_window: true
      width: 3
      height: 3
      robot_radius: 0.1795
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: /scan
          sensor_frame: base_scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          # Matches the LiDAR's own physical range_min/max (plugins.xacro
          # gpu_lidar <range>) and rambla_safety's min_valid_range_m
          # (0.12) so the local costmap doesn't mark the robot's own body
          # as an obstacle.
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.12
          raytrace_max_range: 10.0
          raytrace_min_range: 0.12
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
