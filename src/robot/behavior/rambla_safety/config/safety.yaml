safety_node:
  ros__parameters:
    # M1 bumper/sensor-placement fix (2026-07-09): the 0.3 self-detection
    # floor this comment used to describe is gone. The forward self-return
    # was never the bumper (its z-band [0.008, 0.058] in base_link frame
    # never reached the scan plane) - it was the forward camera box,
    # directly in the scan plane's path at the old height (verified by
    # direct geometric calculation: camera z-band [0.065, 0.085] straddled
    # the old scan_z=0.0755, at ~0.251-0.271m from the rear-offset LiDAR,
    # matching the documented self-return distance exactly). Fixed at the
    # source by raising the LiDAR turret (params.xacro laser_puck_offset)
    # so the scan plane (z=0.10) clears the camera top by 15mm, rather than
    # papering over it here. Confirmed live in sim: open-space front-arc
    # minimum is now ~2.9m (real room geometry), not a ~0.25m self-return.
    # This floor now only needs to clear the LiDAR's own physical range_min
    # (0.1m) with a small noise margin - must stay below stop_distance_m.
    min_valid_range_m: 0.12
    # Forward motion blocked when the front-arc LiDAR minimum (after
    # excluding self-detection below min_valid_range_m) drops below this.
    # 0.35m sits comfortably inside the house world's narrowest doorway
    # gap and outside the robot's base diameter (0.349m, see
    # rambla_description/urdf/params.xacro), so it stops short of
    # furniture/walls without being so cautious the robot can't pass
    # through a doorway. See house.sdf for room/doorway geometry.
    stop_distance_m: 0.35
    # +/- this many degrees either side of straight ahead (angle 0) counts
    # as "front" for the stop-distance check.
    front_arc_deg: 30
